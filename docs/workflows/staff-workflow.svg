<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2150" viewBox="0 0 1600 2150" role="img" aria-labelledby="title desc">
<title id="title">Warden and Mess Manager workflow flowchart</title><desc id="desc">Separate directed Warden and Mess Manager UI flows through role-guarded Express APIs, Prisma Neon, Cloudinary and Socket.IO.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#304f5a"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#173443}.h{font-size:38px;font-weight:700;fill:white}.sub{font-size:17px;fill:#d9e5ec}.lane{font-size:15px;font-weight:700;letter-spacing:1px;fill:#fff}.t{font-size:16px;font-weight:600}.s{font-size:14px;fill:#526d77}.flow{fill:#fff;stroke:#24766e;stroke-width:2}.api{fill:#edf5fa;stroke:#397696;stroke-width:2}.db{fill:#fff4dd;stroke:#bc7b24;stroke-width:2}.decision{fill:#fff4d7;stroke:#bc7b24;stroke-width:2}.reject{fill:#fff0ed;stroke:#b43d36;stroke-width:2}.line{fill:none;stroke:#304f5a;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#248c83;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#a)}.note{font-size:13px;fill:#435b62}</style></defs>
<rect width="1600" height="2450" fill="#edf4f3"/><rect width="1600" height="132" fill="#123844"/><text x="58" y="59" class="h">WARDEN + MESS MANAGER FLOWCHART</text><text x="60" y="98" class="sub">Separate role entry points; arrows show the actual UI → middleware → controller → storage sequence</text>
<rect x="0" y="145" width="520" height="200" fill="#e3efeb"/><rect x="520" y="145" width="510" height="200" fill="#e8f1f6"/><rect x="1030" y="145" width="570" height="200" fill="#f8efdd"/><text x="34" y="174" class="lane" style="fill:#176a65">STAFF UI</text><text x="554" y="174" class="lane" style="fill:#356c87">EXPRESS API + GUARDS</text><text x="1064" y="174" class="lane" style="fill:#996219">CONTROLLER + SERVICES</text>
<ellipse cx="95" cy="245" rx="56" ry="31" class="flow"/><text x="63" y="250" class="t">Start</text><path d="M151 245H181" class="line"/><rect x="190" y="205" width="280" height="80" rx="14" class="flow"/><text x="214" y="237" class="t">Login → POST /auth/login</text><text x="214" y="261" class="s">Credentials → JWT + stored profile</text><path d="M470 245H555" class="line"/><rect x="565" y="205" width="400" height="80" rx="14" class="api"/><text x="588" y="237" class="t">JWT / active-user protection</text><text x="588" y="261" class="s">React role guard; backend checks role on every route</text><path d="M965 245H1020" class="line"/><polygon points="1100,205 1180,245 1100,285 1020,245" class="decision"/><text x="1060" y="250" class="t">Role?</text><path d="M1180 232H1240" class="line"/><rect x="1250" y="190" width="285" height="72" rx="14" class="flow"/><text x="1271" y="220" class="t">Warden UI /warden/*</text><text x="1271" y="243" class="s">Hall-linked operations</text><path d="M1180 260H1210V305H1240" class="line"/><rect x="1250" y="276" width="285" height="72" rx="14" class="flow"/><text x="1271" y="306" class="t">Mess UI /mess/*</text><text x="1271" y="329" class="s">Menu + expenses</text>
<rect x="0" y="365" width="520" height="1415" fill="#e9f2ef"/><rect x="520" y="365" width="510" height="1415" fill="#edf4f8"/><rect x="1030" y="365" width="570" height="1415" fill="#fbf3e5"/><text x="34" y="400" class="lane" style="fill:#176a65">USER ACTION</text><text x="554" y="400" class="lane" style="fill:#356c87">ROUTE + MIDDLEWARE</text><text x="1064" y="400" class="lane" style="fill:#996219">RESULT / SIDE EFFECT</text>
<rect x="70" y="425" width="1460" height="48" rx="10" fill="#194c63"/><text x="95" y="457" class="lane">WARDEN FLOW · role = warden</text>
<g><rect x="42" y="495" width="430" height="150" rx="14" class="flow"/><text x="64" y="531" class="t">Review hall issue queue</text><text x="64" y="559" class="s">Open issue; change status; rejection needs remark</text><text x="64" y="587" class="s">Dashboard / issues page gets live changes</text><text x="64" y="615" class="s">Data scoped to warden's hall</text><path d="M472 570H555" class="line"/><rect x="565" y="495" width="400" height="150" rx="14" class="api"/><text x="588" y="531" class="t">GET /api/issues/warden</text><text x="588" y="559" class="s">PATCH /api/issues/:id/status</text><text x="588" y="587" class="s">protect + warden role + hall ownership</text><text x="588" y="615" class="s">Controller validates transition/remark</text><path d="M965 570H1050" class="line"/><rect x="1060" y="495" width="480" height="150" rx="14" class="db"/><text x="1084" y="531" class="t">Update Issue + IssueTimeline in Neon</text><text x="1084" y="559" class="s">Accepted/in-progress may assign acting warden</text><text x="1084" y="587" class="s">Emit issue-updated to hall/global rooms</text><text x="1084" y="615" class="s">Socket pushes event to subscribed UI</text></g>
<g><rect x="42" y="665" width="430" height="150" rx="14" class="flow"/><text x="64" y="701" class="t">Allocate a student's room</text><text x="64" y="729" class="s">Load students/rooms; choose lottery or room</text><text x="64" y="757" class="s">Lottery suggests; warden accepts to assign</text><text x="64" y="785" class="s">Allocation stays inside warden's hall</text><path d="M472 740H555" class="line"/><rect x="565" y="665" width="400" height="150" rx="14" class="api"/><text x="588" y="701" class="t">GET /users/warden/students, /rooms/warden</text><text x="588" y="729" class="s">POST /rooms/warden/lottery/preview</text><text x="588" y="757" class="s">PATCH /rooms/warden/:roomId/assign</text><text x="588" y="785" class="s">protect + warden role + hall ownership</text><path d="M965 740H1050" class="line"/><rect x="1060" y="665" width="480" height="150" rx="14" class="db"/><text x="1084" y="701" class="t">Lottery preview selects candidate</text><text x="1084" y="729" class="s">Accept updates User.roomId + Room status</text><text x="1084" y="757" class="s">ResidenceHistory + Hall stats + AuditLog</text><text x="1084" y="785" class="s">Prisma writes → Neon PostgreSQL</text></g>
<g><rect x="42" y="835" width="430" height="150" rx="14" class="flow"/><text x="64" y="871" class="t">Publish hall notice</text><text x="64" y="899" class="s">Create/edit/delete; optional image/video/PDF</text><text x="64" y="927" class="s">Student notices refresh after emitted event</text><path d="M472 910H555" class="line"/><rect x="565" y="835" width="400" height="150" rx="14" class="api"/><text x="588" y="871" class="t">GET/POST/PUT/DELETE /api/notices</text><text x="588" y="899" class="s">protect + warden role + Multer on writes</text><text x="588" y="927" class="s">Up to 2 files; image/video/PDF backend filter</text><path d="M965 910H1050" class="line"/><rect x="1060" y="835" width="480" height="150" rx="14" class="db"/><text x="1084" y="871" class="t">Multer memory → Cloudinary</text><text x="1084" y="899" class="s">Notice metadata and media URLs → Neon</text><text x="1084" y="927" class="s">Emit notice-created/updated/deleted by hall</text></g>
<g><rect x="42" y="1005" width="430" height="150" rx="14" class="flow"/><text x="64" y="1041" class="t">Review certificates / manage fines</text><text x="64" y="1069" class="s">Approve/reject/delete; issue/update/delete fine</text><text x="64" y="1097" class="s">View voter lists and polls</text><path d="M472 1080H555" class="line"/><rect x="565" y="1005" width="400" height="150" rx="14" class="api"/><text x="588" y="1041" class="t">Certificates / fines / polls routes</text><text x="588" y="1069" class="s">Warden role + hall and record checks</text><text x="588" y="1097" class="s">Poll create/delete; fine issue/status; cert review</text><path d="M965 1080H1050" class="line"/><rect x="1060" y="1005" width="480" height="150" rx="14" class="db"/><text x="1084" y="1041" class="t">Prisma: Certificate, Fine, Poll/Vote</text><text x="1084" y="1069" class="s">PDF/signature/stamp assets use Cloudinary</text><text x="1084" y="1097" class="s">Domain events emit to hall/staff/student rooms</text></g>
<rect x="70" y="1190" width="1460" height="48" rx="10" fill="#684528"/><text x="95" y="1222" class="lane">MESS MANAGER FLOW · role = mess_manager</text>
<g><rect x="42" y="1260" width="430" height="150" rx="14" class="flow"/><text x="64" y="1296" class="t">Create or manage daily menu</text><text x="64" y="1324" class="s">/mess/menu lists, creates and deletes entries</text><text x="64" y="1352" class="s">User sees REST response / refreshed list</text><path d="M472 1335H555" class="line"/><rect x="565" y="1260" width="400" height="150" rx="14" class="api"/><text x="588" y="1296" class="t">GET/POST/PUT/DELETE /api/mess/menus</text><text x="588" y="1324" class="s">protect; writes require mess_manager/admin</text><text x="588" y="1352" class="s">Controller checks hall and creator/admin</text><path d="M965 1335H1050" class="line"/><rect x="1060" y="1260" width="480" height="150" rx="14" class="db"/><text x="1084" y="1296" class="t">DailyMenu + creator/hall in Neon</text><text x="1084" y="1324" class="s">JSON returns; React updates page</text><text x="1084" y="1352" class="s">No Socket.IO menu events currently</text></g>
<g><rect x="42" y="1430" width="430" height="150" rx="14" class="flow"/><text x="64" y="1466" class="t">Record mess expense</text><text x="64" y="1494" class="s">Create expense with optional attachments</text><text x="64" y="1522" class="s">List/delete entries or remove attachment</text><path d="M472 1505H555" class="line"/><rect x="565" y="1430" width="400" height="150" rx="14" class="api"/><text x="588" y="1466" class="t">/api/mess/expenses CRUD</text><text x="588" y="1494" class="s">protect + mess_manager/admin + Multer</text><text x="588" y="1522" class="s">Up to 5 image/PDF files, 2 MB each</text><path d="M965 1505H1050" class="line"/><rect x="1060" y="1430" width="480" height="150" rx="14" class="db"/><text x="1084" y="1466" class="t">Multer memory → Cloudinary</text><text x="1084" y="1494" class="s">MessExpense metadata/URLs → Neon</text><text x="1084" y="1522" class="s">No expense Socket.IO events currently</text></g>
<g><rect x="42" y="1600" width="430" height="150" rx="14" class="flow"/><text x="64" y="1636" class="t">Open /mess/fines</text><text x="64" y="1664" class="s">Current route renders shared student Fines page</text><text x="64" y="1692" class="s">Page requests student fines / proof actions</text><path d="M472 1675H555" class="line"/><rect x="565" y="1600" width="400" height="150" rx="14" class="api"/><text x="588" y="1636" class="t">GET /api/fines/student</text><text x="588" y="1664" class="s">authorizeRoles("student")</text><text x="588" y="1692" class="s">Mess manager is not an allowed role</text><path d="M965 1675H1050" class="line"/><rect x="1060" y="1600" width="480" height="150" rx="14" class="reject"/><text x="1084" y="1636" class="t">403 Access denied</text><text x="1084" y="1664" class="s">This is a UI/backend mismatch, not a supported</text><text x="1084" y="1692" class="s">mess-manager fine workflow in current code</text></g>
<rect x="70" y="1785" width="1460" height="300" rx="16" fill="#123844"/><text x="100" y="1833" class="lane">END / SHARED BACKEND + REALTIME</text><text x="100" y="1875" class="sub">All routes: Helmet → CORS allowlist → rate/body limits → protect JWT + active account → role middleware.</text><text x="100" y="1915" class="sub">Prisma Client → Neon. Controllers enforce hall/creator ownership. Mutations return JSON to React.</text><text x="100" y="1955" class="sub">Multer memory uploads → Cloudinary for notices, certificate PDFs/assets, fine proofs and mess expenses.</text><text x="100" y="1995" class="sub">Warden: issue, notice, poll, certificate and fine Socket.IO events. Mess: no menu/expense events.</text><text x="100" y="2035" class="sub">Socket handshake verifies JWT and active account; server controls hall/staff/user/global room joins.</text>
</svg>
