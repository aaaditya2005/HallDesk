<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
<title id="title">Admin workflow flowchart</title><desc id="desc">Directional admin login and operations through UI, secured API, controllers, Neon and audit/realtime services.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#304f5a"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#173443}.h{font-size:38px;font-weight:700;fill:white}.sub{font-size:17px;fill:#d9e5ec}.lane{font-size:15px;font-weight:700;letter-spacing:1px;fill:#fff}.t{font-size:16px;font-weight:600}.s{font-size:14px;fill:#526d77}.flow{fill:#fff;stroke:#244d72;stroke-width:2}.api{fill:#edf5fa;stroke:#397696;stroke-width:2}.db{fill:#fff4dd;stroke:#bc7b24;stroke-width:2}.decision{fill:#fff4d7;stroke:#bc7b24;stroke-width:2}.line{fill:none;stroke:#304f5a;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#ad6d1d;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#a)}.note{font-size:13px;fill:#435b62}</style></defs>
<rect width="1600" height="2250" fill="#f0f3f7"/><rect width="1600" height="132" fill="#173b5b"/><text x="58" y="59" class="h">ADMIN WORKFLOW FLOWCHART</text><text x="60" y="98" class="sub">Login → choose admin task → secured route → controller → Neon / audit / realtime</text>
<rect x="0" y="145" width="520" height="205" fill="#e2eaf1"/><rect x="520" y="145" width="510" height="205" fill="#e7f0f5"/><rect x="1030" y="145" width="570" height="205" fill="#f7edd9"/><text x="34" y="174" class="lane" style="fill:#173b5b">ADMIN UI</text><text x="554" y="174" class="lane" style="fill:#356c87">API + GUARDS</text><text x="1064" y="174" class="lane" style="fill:#996219">CONTROLLER + DATA</text>
<ellipse cx="95" cy="245" rx="56" ry="31" class="flow"/><text x="63" y="250" class="t">Start</text><path d="M151 245H181" class="line"/><rect x="190" y="205" width="280" height="80" rx="14" class="flow"/><text x="214" y="237" class="t">Admin enters credentials</text><text x="214" y="261" class="s">POST /api/auth/login</text><path d="M470 245H555" class="line"/><rect x="565" y="205" width="380" height="80" rx="14" class="api"/><text x="587" y="237" class="t">Password + account check</text><text x="587" y="261" class="s">bcrypt · active account · JWT</text><path d="M945 245H1018" class="line"/><polygon points="1100,205 1180,245 1100,285 1020,245" class="decision"/><text x="1060" y="250" class="t">Valid?</text><path d="M1180 245H1220" class="line"/><rect x="1230" y="205" width="315" height="80" rx="14" class="flow"/><text x="1253" y="237" class="t">Store session + open admin UI</text><text x="1253" y="261" class="s">ProtectedRoute requires role admin</text><text x="1110" y="312" class="note">No → show error and remain on login</text>
<rect x="0" y="370" width="520" height="1180" fill="#edf2f6"/><rect x="520" y="370" width="510" height="1180" fill="#f0f6f8"/><rect x="1030" y="370" width="570" height="1180" fill="#fbf4e7"/><text x="34" y="405" class="lane" style="fill:#173b5b">ADMIN ACTION</text><text x="554" y="405" class="lane" style="fill:#356c87">API → MIDDLEWARE</text><text x="1064" y="405" class="lane" style="fill:#996219">BUSINESS RESULT</text>
<g><rect x="42" y="435" width="430" height="115" rx="14" class="flow"/><text x="64" y="470" class="t">Open dashboard</text><text x="64" y="497" class="s">Inspect system and hall counts</text><path d="M472 492H555" class="line"/><rect x="565" y="435" width="400" height="115" rx="14" class="api"/><text x="588" y="470" class="t">GET /api/dashboard/admin</text><text x="588" y="497" class="s">protect + authorizeRoles(admin)</text><path d="M965 492H1050" class="line"/><rect x="1060" y="435" width="480" height="115" rx="14" class="db"/><text x="1084" y="470" class="t">Controller aggregates Prisma reads</text><text x="1084" y="497" class="s">Neon → JSON stats → dashboard widgets</text></g>
<g><rect x="42" y="580" width="430" height="165" rx="14" class="flow"/><text x="64" y="616" class="t">Manage users</text><text x="64" y="644" class="s">Create/edit/status/delete; transfer/bulk transfer;</text><text x="64" y="672" class="s">final-year cleanup</text><text x="64" y="710" class="s">Review results and audit history</text><path d="M472 662H555" class="line"/><rect x="565" y="580" width="400" height="165" rx="14" class="api"/><text x="588" y="616" class="t">/api/users/admin/*</text><text x="588" y="644" class="s">protect + admin role + UUID checks</text><text x="588" y="672" class="s">hash passwords; reject duplicate username</text><text x="588" y="710" class="s">transfer routes validate destination hall/gender</text><path d="M965 662H1050" class="line"/><rect x="1060" y="580" width="480" height="165" rx="14" class="db"/><text x="1084" y="616" class="t">Prisma mutates User / Hall links</text><text x="1084" y="644" class="s">ResidenceHistory updates for transfer</text><text x="1084" y="672" class="s">Related records handled by cleanup rules</text><text x="1084" y="710" class="s">Selected actions → AuditLog</text></g>
<g><rect x="42" y="775" width="430" height="165" rx="14" class="flow"/><text x="64" y="811" class="t">Configure halls and rooms</text><text x="64" y="839" class="s">Add/edit/activate halls; add/edit/delete rooms;</text><text x="64" y="867" class="s">generate room ranges and filter inventory</text><text x="64" y="905" class="s">Occupied rooms cannot be deleted</text><path d="M472 857H555" class="line"/><rect x="565" y="775" width="400" height="165" rx="14" class="api"/><text x="588" y="811" class="t">/api/halls · /api/rooms</text><text x="588" y="839" class="s">POST/PATCH/DELETE + /rooms/generate</text><text x="588" y="867" class="s">protect + admin role + ID validation</text><text x="588" y="905" class="s">Controller validates dependencies/capacity</text><path d="M965 857H1050" class="line"/><rect x="1060" y="775" width="480" height="165" rx="14" class="db"/><text x="1084" y="811" class="t">Prisma writes Hall / Room</text><text x="1084" y="839" class="s">Update hall room counts and capacity</text><text x="1084" y="867" class="s">Selected create/edit/delete → AuditLog</text><text x="1084" y="905" class="s">No Cloudinary for hall/room CRUD</text></g>
<g><rect x="42" y="970" width="430" height="165" rx="14" class="flow"/><text x="64" y="1006" class="t">Manage issues</text><text x="64" y="1034" class="s">View all, filter/search, open details, delete</text><text x="64" y="1062" class="s">Analytics separately summarizes hall/category/date</text><text x="64" y="1100" class="s">Analytics calculations run in frontend</text><path d="M472 1052H555" class="line"/><rect x="565" y="970" width="400" height="165" rx="14" class="api"/><text x="588" y="1006" class="t">GET /api/issues · GET /:id</text><text x="588" y="1034" class="s">DELETE /api/issues/:id</text><text x="588" y="1062" class="s">protect + admin role; controller authorization</text><text x="588" y="1100" class="s">Analytics uses GET issues, no analytics API</text><path d="M965 1052H1050" class="line"/><rect x="1060" y="970" width="480" height="165" rx="14" class="db"/><text x="1084" y="1006" class="t">Prisma Issue / IssueTimeline writes</text><text x="1084" y="1034" class="s">Delete associated Cloudinary issue media</text><text x="1084" y="1062" class="s">Selected deletion → AuditLog</text><text x="1084" y="1100" class="s">Emit issue-deleted to global socket room</text></g>
<g><rect x="42" y="1165" width="430" height="165" rx="14" class="flow"/><text x="64" y="1201" class="t">Review audit logs</text><text x="64" y="1229" class="s">Filter by user role or date range</text><text x="64" y="1257" class="s">Inspect actor/action/entity/details</text><path d="M472 1247H555" class="line"/><rect x="565" y="1165" width="400" height="165" rx="14" class="api"/><text x="588" y="1201" class="t">GET /api/audit/admin</text><text x="588" y="1229" class="s">protect + authorizeRoles(admin)</text><text x="588" y="1257" class="s">Optional date/role query filters</text><path d="M965 1247H1050" class="line"/><rect x="1060" y="1165" width="480" height="165" rx="14" class="db"/><text x="1084" y="1201" class="t">Read AuditLog + actor from Neon</text><text x="1084" y="1229" class="s">Return latest 200 logs</text><text x="1084" y="1257" class="s">Not every read/action is audited</text></g>
<polygon points="250,1390 360,1455 250,1520 140,1455" class="decision"/><text x="188" y="1450" class="t">Other</text><text x="178" y="1474" class="s">admin feature?</text><path d="M360 1455H455" class="line"/><rect x="465" y="1390" width="480" height="130" rx="14" class="api"/><text x="488" y="1428" class="t">Backend permits admin on some APIs</text><text x="488" y="1456" class="s">Notices · certificates · fines · polls · mess</text><text x="488" y="1484" class="s">Most have no dedicated admin UI page today</text><path d="M945 1455H1040" class="dash"/><rect x="1050" y="1390" width="490" height="130" rx="14" class="db"/><text x="1074" y="1428" class="t">Only reachable by API/client capability</text><text x="1074" y="1456" class="s">Do not confuse permission with available screen</text><text x="1074" y="1484" class="s">No admin listeners for most non-issue events</text>
<rect x="70" y="1580" width="1460" height="280" rx="16" fill="#173b5b"/><text x="100" y="1628" class="lane">END / SHARED ADMIN BACKEND</text><text x="100" y="1670" class="sub">Express: Helmet → CORS allowlist → API rate limit/body limits → route → JWT/active-user check → admin role check.</text><text x="100" y="1710" class="sub">Controller → Prisma Client → Neon PostgreSQL. Responses are JSON; Axios sends them back to React.</text><text x="100" y="1750" class="sub">Selected mutations write AuditLog. Media upload only where an admin-enabled media endpoint is used.</text><text x="100" y="1790" class="sub">Socket.IO authenticates separately; Admin joins global room and listens for issue-created/updated/deleted.</text>
</svg>
