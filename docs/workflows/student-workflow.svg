<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
<title id="title">Student workflow flowchart</title><desc id="desc">Directional student account and feature flow from login through UI, protected API, controllers, Neon, Cloudinary, and Socket.IO.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#304f5a"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#163640}.h{font-size:38px;font-weight:700;fill:white}.sub{font-size:17px;fill:#d5e6e5}.lane{font-size:15px;font-weight:700;letter-spacing:1px;fill:#fff}.t{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4f6971}.flow{fill:#fff;stroke:#2a7772;stroke-width:2}.api{fill:#eff7fb;stroke:#3b7292;stroke-width:2}.db{fill:#fff5df;stroke:#bc7b24;stroke-width:2}.decision{fill:#fff4d7;stroke:#bc7b24;stroke-width:2}.line{fill:none;stroke:#304f5a;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#248c83;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#a)}.note{font-size:13px;fill:#435b62}</style></defs>
<rect width="1600" height="2250" fill="#edf4f3"/><rect width="1600" height="132" fill="#123844"/><text x="58" y="59" class="h">STUDENT ACCOUNT + FEATURE FLOW</text><text x="60" y="98" class="sub">Follow arrows from account login into student actions; each row is a real UI → API → backend path.</text>
<rect x="0" y="145" width="520" height="205" fill="#dcece9"/><rect x="520" y="145" width="510" height="205" fill="#e3eef4"/><rect x="1030" y="145" width="570" height="205" fill="#f7ead1"/><text x="34" y="174" class="lane" fill="#176a65">FRONTEND</text><text x="554" y="174" class="lane" fill="#356c87">API + MIDDLEWARE</text><text x="1064" y="174" class="lane" fill="#996219">CONTROLLER + SERVICES</text>
<ellipse cx="95" cy="245" rx="56" ry="31" class="flow"/><text x="63" y="250" class="t">Start</text><path d="M151 245H181" class="line"/><rect x="190" y="205" width="280" height="80" rx="14" class="flow"/><text x="214" y="237" class="t">Enter credentials</text><text x="214" y="261" class="s">Login UI → POST /auth/login</text><path d="M470 245H555" class="line"/><rect x="565" y="205" width="380" height="80" rx="14" class="api"/><text x="587" y="237" class="t">Check password + active account</text><text x="587" y="261" class="s">bcrypt compare · update lastLogin · issue JWT</text><path d="M945 245H1018" class="line"/><polygon points="1100,205 1180,245 1100,285 1020,245" class="decision"/><text x="1060" y="250" class="t">Valid?</text><path d="M1180 245H1220" class="line"/><rect x="1230" y="205" width="315" height="80" rx="14" class="flow"/><text x="1253" y="237" class="t">Store token + student profile</text><text x="1253" y="261" class="s">ProtectedRoute → /student/dashboard</text><text x="1110" y="312" class="note">No → show login error; remain at /</text>
<rect x="0" y="370" width="520" height="1160" fill="#e8f2ef"/><rect x="520" y="370" width="510" height="1160" fill="#edf4f8"/><rect x="1030" y="370" width="570" height="1160" fill="#fbf3e5"/><text x="34" y="405" class="lane" style="fill:#176a65">STUDENT UI ACTION</text><text x="554" y="405" class="lane" style="fill:#356c87">ROUTE → AUTH → ROLE</text><text x="1064" y="405" class="lane" style="fill:#996219">BUSINESS ACTION → RESULT</text>
<!-- dashboard -->
<rect x="42" y="435" width="430" height="115" rx="14" class="flow"/><text x="64" y="470" class="t">Open dashboard</text><text x="64" y="497" class="s">Counts, notices, recent activity</text><text x="64" y="522" class="s">Choose a feature below</text><path d="M472 492H555" class="line"/><rect x="565" y="435" width="400" height="115" rx="14" class="api"/><text x="588" y="470" class="t">GET /api/dashboard/student</text><text x="588" y="497" class="s">protect verifies JWT + active user</text><text x="588" y="522" class="s">No separate dashboard role middleware</text><path d="M965 492H1050" class="line"/><rect x="1060" y="435" width="480" height="115" rx="14" class="db"/><text x="1084" y="470" class="t">Aggregate Prisma reads → Neon</text><text x="1084" y="497" class="s">User · Issue · Certificate · Poll · Fine · Notice</text><text x="1084" y="522" class="s">JSON response updates dashboard</text>
<!-- issue flow -->
<rect x="42" y="580" width="430" height="180" rx="14" class="flow"/><text x="64" y="616" class="t">Create issue</text><text x="64" y="644" class="s">Enter category/details; attach images</text><polygon points="255,677 320,713 255,749 190,713" class="decision"/><text x="219" y="718" class="s">Images?</text><path d="M472 670H555" class="line"/><rect x="565" y="580" width="400" height="180" rx="14" class="api"/><text x="588" y="616" class="t">POST /api/issues</text><text x="588" y="644" class="s">protect → student role → Multer</text><text x="588" y="672" class="s">MIME + max 2 files, 2 MB each</text><text x="588" y="700" class="s">Controller validates hall / request</text><text x="588" y="728" class="s">Issue edits via PUT exist; no edit UI</text><path d="M965 670H1050" class="line"/><rect x="1060" y="580" width="480" height="180" rx="14" class="db"/><text x="1084" y="616" class="t">Cloudinary (if images) + Neon write</text><text x="1084" y="644" class="s">Issue + IssueTimeline; return formatted issue</text><text x="1084" y="672" class="s">Emit issue-created to hall Socket.IO room</text><text x="1084" y="700" class="s">Issue list/detail use GET /issues/my, /issues/:id</text><text x="1084" y="728" class="s">Ownership check before detail is returned</text>
<!-- certificates -->
<rect x="42" y="790" width="430" height="155" rx="14" class="flow"/><text x="64" y="826" class="t">Request / track certificate</text><text x="64" y="854" class="s">Leave or Bonafide request</text><text x="64" y="882" class="s">Delete request / download approved PDF</text><text x="64" y="910" class="s">View hall notices and attachments</text><path d="M472 868H555" class="line"/><rect x="565" y="790" width="400" height="155" rx="14" class="api"/><text x="588" y="826" class="t">/api/certificates/student</text><text x="588" y="854" class="s">POST /request · DELETE /:id</text><text x="588" y="882" class="s">GET /:id/file; student role/ownership</text><text x="588" y="910" class="s">Notices: GET /api/notices, hall scoped</text><path d="M965 868H1050" class="line"/><rect x="1060" y="790" width="480" height="155" rx="14" class="db"/><text x="1084" y="826" class="t">Certificate → Neon; PDF → Cloudinary</text><text x="1084" y="854" class="s">File stream/download is authenticated</text><text x="1084" y="882" class="s">certificate events to user room</text><text x="1084" y="910" class="s">notice events to hall room</text>
<!-- polls -->
<rect x="42" y="975" width="430" height="145" rx="14" class="flow"/><text x="64" y="1011" class="t">Open poll → select option → vote</text><text x="64" y="1039" class="s">Poll list and result counts update</text><text x="64" y="1067" class="s">One vote per student enforced server-side</text><path d="M472 1048H555" class="line"/><rect x="565" y="975" width="400" height="145" rx="14" class="api"/><text x="588" y="1011" class="t">GET /api/polls</text><text x="588" y="1039" class="s">POST /api/polls/:id/vote</text><text x="588" y="1067" class="s">protect + student role + poll checks</text><path d="M965 1048H1050" class="line"/><rect x="1060" y="975" width="480" height="145" rx="14" class="db"/><text x="1084" y="1011" class="t">Neon: Poll / PollOption / Vote</text><text x="1084" y="1039" class="s">Emit vote-casted and poll update events</text><text x="1084" y="1067" class="s">Hall Socket.IO subscribers refresh results</text>
<!-- fines -->
<rect x="42" y="1150" width="430" height="160" rx="14" class="flow"/><text x="64" y="1186" class="t">Review fine → upload proof</text><text x="64" y="1214" class="s">Proof may be image or PDF</text><text x="64" y="1242" class="s">Other hall fines may display read-only</text><text x="64" y="1270" class="s">UI ownership does not restrict API response</text><path d="M472 1230H555" class="line"/><rect x="565" y="1150" width="400" height="160" rx="14" class="api"/><text x="588" y="1186" class="t">GET /api/fines/student</text><text x="588" y="1214" class="s">POST /api/fines/:id/upload-proof</text><text x="588" y="1242" class="s">Student role + Multer proof validation</text><text x="588" y="1270" class="s">Controller checks ownership and state</text><path d="M965 1230H1050" class="line"/><rect x="1060" y="1150" width="480" height="160" rx="14" class="db"/><text x="1084" y="1186" class="t">Fine metadata → Neon</text><text x="1084" y="1214" class="s">Payment proof → Cloudinary</text><text x="1084" y="1242" class="s">fine-created/updated/deleted to hall room</text><text x="1084" y="1270" class="s">Caveat: list query currently hall-scoped</text>
<!-- mess profile -->
<rect x="42" y="1340" width="430" height="160" rx="14" class="flow"/><text x="64" y="1376" class="t">Read mess / update profile</text><text x="64" y="1404" class="s">Menu and expenses are student read-only</text><text x="64" y="1432" class="s">Profile: view details or change password</text><text x="64" y="1460" class="s">Password change requires current password</text><path d="M472 1420H555" class="line"/><rect x="565" y="1340" width="400" height="160" rx="14" class="api"/><text x="588" y="1376" class="t">GET /api/mess/menus, /expenses</text><text x="588" y="1404" class="s">GET /api/users/profile</text><text x="588" y="1432" class="s">PUT /api/users/profile/password</text><text x="588" y="1460" class="s">protect; bcrypt hash update</text><path d="M965 1420H1050" class="line"/><rect x="1060" y="1340" width="480" height="160" rx="14" class="db"/><text x="1084" y="1376" class="t">Hall menu/expense read → Neon</text><text x="1084" y="1404" class="s">Password hash → User record in Neon</text><text x="1084" y="1432" class="s">REST response refreshes profile UI</text><text x="1084" y="1460" class="s">No mess Socket.IO events</text>
<rect x="70" y="1550" width="1460" height="260" rx="16" fill="#123844"/><text x="100" y="1597" class="lane">END / SHARED SERVICES</text><text x="100" y="1640" class="sub">Prisma Client → Neon PostgreSQL. bcrypt hashes passwords. Controllers apply validation, hall scoping and ownership checks.</text><text x="100" y="1680" class="sub">Multer stores upload buffers in memory, then Cloudinary stores issue images, approved PDFs and fine proofs.</text><text x="100" y="1720" class="sub">Socket.IO verifies JWT separately; student joins user + hall rooms and receives only subscribed domain events.</text><text x="100" y="1760" class="sub">REST JSON returns to React; error/401 path clears expired session and sends user back to login.</text>
</svg>
